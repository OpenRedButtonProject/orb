<html>
<head>
   <style>
      html, body {
         margin: 0;
         width: 100%;
         height: 100%;
         overflow: hidden;
         background: transparent;
      }
      #orb_video {
         position: absolute;
         left: 0;
         top: 0;
         width: 100%;
         height: 100%;
         object-fit: contain;
         z-index: 1;
         /* Keep the video in the WebView compositor so HTML TTML can overlay it. */
         transform: translateZ(0);
         -webkit-transform: translateZ(0);
      }
      #orb_subsPH {
         position: absolute;
         left: 0;
         top: 0;
         width: 100%;
         height: 100%;
         overflow: hidden;
         pointer-events: none;
         z-index: 2;
      }
   </style>
</head>
<body>
   <video id='orb_video'></video>
   <div id='orb_subsPH'></div>
</body>
</html>
